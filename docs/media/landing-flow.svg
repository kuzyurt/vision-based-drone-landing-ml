<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 660" width="1600" height="660" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
  <rect width="1600" height="660" fill="#ffffff"/>

  <!-- legend -->
  <g font-size="28" font-weight="600" fill="#0d1b24">
    <rect x="1010" y="42" width="28" height="28" rx="6" fill="#0b7a75"/>
    <text x="1052" y="66">Search head</text>
    <rect x="1260" y="42" width="28" height="28" rx="6" fill="#1d3a4c"/>
    <text x="1302" y="66">Precision landing</text>
  </g>

  <!-- sea -->
  <path d="M0 500 q50 -14 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 V600 H0z" fill="#e4eff1"/>

  <!-- decoy boat -->
  <path d="M600 496 h150 l-24 30 h-102z" fill="#b9c8ce"/>
  <rect x="650" y="466" width="46" height="30" rx="4" fill="#cfdadf"/>

  <!-- target boat with pad -->
  <path d="M1130 496 h390 l-50 40 h-290z" fill="#1d3a4c"/>
  <rect x="1160" y="454" width="70" height="42" rx="5" fill="#c9d6db"/>
  <rect x="1290" y="486" width="100" height="10" rx="3" fill="#0b7a75"/>

  <!-- flight path -->
  <g fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M130 150 C 400 140, 500 170, 600 176" stroke="#0b7a75"/>
    <path d="M600 176 C 760 184, 800 216, 950 242 C 1090 266, 1180 276, 1260 306 C 1310 326, 1340 380, 1340 466" stroke="#1d3a4c"/>
  </g>

  <!-- drone: seen from above and slightly in front, so the body and camera sit lower than the rotors -->
  <!-- drone: Iconoir "drone" (MIT) -->
  <g transform="translate(56 112) scale(2.9)" fill="none" stroke="#0d1b24" stroke-width="1.5" stroke-linecap="round">
    <path d="M13.463 17h-2.926a.6.6 0 0 1-.596-.534l-.867-7.8A.6.6 0 0 1 9.67 8h4.66a.6.6 0 0 1 .596.666l-.867 7.8a.6.6 0 0 1-.596.534Z"/>
    <path d="M4.5 7a2.5 2.5 0 1 0 0-5a2.5 2.5 0 0 0 0 5"/>
    <path d="M4.5 4.5L9 8M4.5 19.5l5-4m10-11L15 8m4.5 11.5l-5-4"/>
    <path d="M4.5 22a2.5 2.5 0 1 0 0-5a2.5 2.5 0 0 0 0 5m15-15a2.5 2.5 0 1 0 0-5a2.5 2.5 0 0 0 0 5m0 15a2.5 2.5 0 1 0 0-5a2.5 2.5 0 0 0 0 5"/>
  </g>

  <!-- step markers -->
  <g font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="220" cy="148" r="24" fill="#0b7a75"/><text x="220" y="157">1</text>
    <circle cx="600" cy="176" r="24" fill="#0b7a75"/><text x="600" y="185">2</text>
    <circle cx="950" cy="242" r="24" fill="#1d3a4c"/><text x="950" y="251">3</text>
    <circle cx="1260" cy="306" r="24" fill="#1d3a4c"/><text x="1260" y="315">4</text>
    <circle cx="1340" cy="420" r="24" fill="#1d3a4c"/><text x="1340" y="429">5</text>
  </g>
  <g font-size="34" font-weight="700" fill="#0d1b24" text-anchor="middle">
    <text x="220" y="104">Search</text>
    <text x="600" y="132">Identify</text>
    <text x="950" y="198">Approach</text>
  </g>
  <g font-size="34" font-weight="700" fill="#0d1b24">
    <text x="1296" y="296">Measure pad</text>
    <text x="1380" y="430">Land</text>
  </g>

  <!-- distance -->
  <g stroke="#0d1b24" stroke-width="3" stroke-linecap="round">
    <line x1="130" y1="630" x2="1340" y2="630"/>
    <line x1="130" y1="618" x2="130" y2="642"/>
    <line x1="1340" y1="618" x2="1340" y2="642"/>
  </g>
  <rect x="625" y="608" width="220" height="44" fill="#ffffff"/>
  <text x="755" y="640" font-size="30" font-weight="600" fill="#0d1b24" text-anchor="middle">up to 100 m</text>
</svg>
