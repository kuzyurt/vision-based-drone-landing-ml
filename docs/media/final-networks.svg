<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 880" width="1500" height="880" font-family="Inter, 'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2c3f4b"/></marker>
  </defs>
  <rect width="1500" height="880" fill="#ffffff"/>
  <text x="48" y="64" font-size="38" font-weight="700" fill="#0d1b24">Inside the two networks</text>

  <g fill="none" stroke="#2c3f4b" stroke-width="2.5">
    <path d="M248 260V326" marker-end="url(#a)"/>
    <path d="M708 260V326" marker-end="url(#a)"/>
    <path d="M1208 260V326" marker-end="url(#a)"/>
    <path d="M708 450V506" marker-end="url(#a)"/>
    <path d="M1208 450V506" marker-end="url(#a)"/>
    <path d="M978 630V686" marker-end="url(#a)"/>
  </g>

  <!-- inputs -->
  <g font-size="19" fill="#ffffff">
    <rect x="48" y="140" width="860" height="120" rx="14" fill="#173a4c"/>
    <text x="72" y="188" font-size="27" font-weight="700">Image encoder: MobileNetV3-Small</text>
    <text x="72" y="226">Camera image 640 × 360. Early layers give fine and coarse maps, the last one 576 channels.</text>

    <rect x="968" y="140" width="480" height="120" rx="14" fill="#173a4c"/>
    <text x="992" y="188" font-size="27" font-weight="700">Own state: 32 numbers</text>
    <text x="992" y="226">speed, attitude, camera angles; radio left out</text>
  </g>

  <!-- search head -->
  <g font-size="19" fill="#ffffff">
    <rect x="48" y="330" width="400" height="190" rx="14" fill="#0b7a75"/>
    <text x="72" y="376" font-size="27" font-weight="700">Search head</text>
    <text x="72" y="406">about 45,000 parameters</text>
    <text x="72" y="444">For each patch of the image:</text>
    <text x="72" y="472">is a boat here, and where exactly?</text>
    <text x="72" y="500">target, similar, other or unknown?</text>
  </g>
  <text x="48" y="560" font-size="20" fill="#2c3f4b">Out: every boat in the image,</text>
  <text x="48" y="588" font-size="20" fill="#2c3f4b">and which one is the target</text>

  <!-- main network -->
  <g font-size="19" fill="#ffffff">
    <rect x="508" y="330" width="400" height="120" rx="14" fill="#23688f"/>
    <text x="532" y="376" font-size="27" font-weight="700">Image summary</text>
    <text x="532" y="414">576 channels → 256 features</text>

    <rect x="968" y="330" width="480" height="120" rx="14" fill="#23688f"/>
    <text x="992" y="376" font-size="27" font-weight="700">State features</text>
    <text x="992" y="414">32 numbers → 64 features</text>

    <rect x="508" y="510" width="940" height="120" rx="14" fill="#23688f"/>
    <text x="532" y="558" font-size="27" font-weight="700">Memory (GRU, 128 values)</text>
    <text x="532" y="596">keeps what it saw in earlier frames, so the pad can be tracked when it is briefly hidden</text>

    <rect x="508" y="690" width="940" height="120" rx="14" fill="#23688f"/>
    <text x="532" y="738" font-size="27" font-weight="700">Out: 15 numbers</text>
    <text x="532" y="776">pad in view, pad position and speed, heading, deck tilt, pad in the image, contact</text>
  </g>

  <text x="508" y="850" font-size="20" fill="#2c3f4b">The encoder and the blue boxes are the main network, about 1.55 million parameters.</text>
</svg>
