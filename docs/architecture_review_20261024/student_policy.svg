<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2020" viewBox="0 0 1800 2020" role="img" aria-labelledby="title desc">
<title id="title">Student landing policy: inputs, networks, outputs and flight control</title>
<desc id="desc">640 by 360 RGB and formatted drone measurements feed a MobileNet CNN and measurement network. 256 image features and 64 measurement features feed one GRU layer with 128 memory values. State heads and optional radio correction produce 15 deck estimates. A separate image head locates the marker. Geometry and written control code output six commands. PX4 controls four motors; two camera commands control the gimbal.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#596773"/></marker></defs>
<style>text{font-family:'Segoe UI',Arial,sans-serif}</style>
<rect width="1800" height="2020" fill="#fafafa"/>
<text x="90" y="66" font-size="42" font-weight="700" fill="#243448">How the student landing policy works</text>
<text x="90" y="108" font-size="23" font-weight="400" fill="#596773">Inputs → neural estimates → checked geometry → movement commands → flight control</text>
<text x="90" y="154" font-size="17" font-weight="700" fill="#243448">1   INPUTS</text>
<g data-card="camera"><rect x="90" y="175" width="450" height="175" rx="10" fill="#ffffff" stroke="#a6adb7" stroke-width="1.6"/>
<text x="112" y="213" font-size="25" font-weight="650" fill="#243448">Camera image</text>
<text x="112" y="245" font-size="21" font-weight="400" fill="#243448">640 × 360 pixels</text>
<text x="112" y="271" font-size="21" font-weight="400" fill="#243448">RGB colour: 3 channels</text>
<text x="112" y="297" font-size="21" font-weight="400" fill="#243448">Image array: 360 × 640 × 3</text>
<text x="112" y="323" font-size="21" font-weight="400" fill="#243448">One image at each decision step</text>
</g>
<g data-card="own"><rect x="660" y="175" width="450" height="175" rx="10" fill="#ffffff" stroke="#a6adb7" stroke-width="1.6"/>
<text x="682" y="213" font-size="25" font-weight="650" fill="#243448">Drone measurements</text>
<text x="682" y="245" font-size="21" font-weight="400" fill="#243448">Speed, attitude, rotation rates</text>
<text x="682" y="271" font-size="21" font-weight="400" fill="#243448">Camera pan/tilt, timing + validity</text>
<text x="682" y="297" font-size="21" font-weight="400" fill="#243448">Formatted into 32 input values</text>
<text x="682" y="323" font-size="21" font-weight="400" fill="#243448">Own position → tracking below</text>
</g>
<g data-card="radio"><rect x="1230" y="175" width="480" height="175" rx="10" fill="#ffffff" stroke="#a6adb7" stroke-width="1.6"/>
<text x="1252" y="213" font-size="25" font-weight="650" fill="#243448">Boat radio • optional</text>
<text x="1252" y="245" font-size="21" font-weight="400" fill="#243448">Boat-relative position: 3 values</text>
<text x="1252" y="271" font-size="21" font-weight="400" fill="#243448">Boat velocity: 3 values</text>
<text x="1252" y="297" font-size="21" font-weight="400" fill="#243448">Packet age + uncertainty + status</text>
<text x="1252" y="323" font-size="21" font-weight="400" fill="#243448">Missing / ≥ 3 s old = unavailable</text>
</g>
<rect x="60" y="415" width="1680" height="690" rx="16" fill="#f5f2fa" stroke="#d5cde3"/>
<text x="90" y="450" font-size="17" font-weight="700" fill="#645196">2   NEURAL PROCESSING</text>
<path d="M315 350 V470" fill="none" stroke="#596773" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M885 350 V470" fill="none" stroke="#596773" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1470 350 V470" fill="none" stroke="#596773" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g data-card="cnn"><rect x="90" y="475" width="450" height="155" rx="10" fill="#f0eafb" stroke="#7862bc" stroke-width="1.6"/>
<text x="112" y="502" font-size="14" font-weight="700" fill="#645196">NEURAL NETWORK</text>
<text x="112" y="532" font-size="25" font-weight="650" fill="#243448">CNN • image features</text>
<text x="112" y="564" font-size="21" font-weight="400" fill="#243448">MobileNetV3-Small</text>
<text x="112" y="590" font-size="21" font-weight="400" fill="#243448">11 feature blocks + 2 conv stages</text>
<text x="112" y="616" font-size="21" font-weight="400" fill="#243448">Extracts patterns from RGB</text>
</g>
<g data-card="measurements"><rect x="660" y="475" width="450" height="155" rx="10" fill="#f0eafb" stroke="#7862bc" stroke-width="1.6"/>
<text x="682" y="502" font-size="14" font-weight="700" fill="#645196">NEURAL NETWORK</text>
<text x="682" y="532" font-size="25" font-weight="650" fill="#243448">Measurement network</text>
<text x="682" y="564" font-size="21" font-weight="400" fill="#243448">32 → 64 → 64 numbers</text>
<text x="682" y="590" font-size="21" font-weight="400" fill="#243448">Boat-radio fields neutralized here</text>
<text x="682" y="616" font-size="21" font-weight="400" fill="#243448">Outputs 64 measurement features</text>
</g>
<g data-card="radio_gate"><rect x="1230" y="475" width="480" height="155" rx="10" fill="#f0eafb" stroke="#7862bc" stroke-width="1.6"/>
<text x="1252" y="502" font-size="14" font-weight="700" fill="#645196">NEURAL NETWORK • OPTIONAL</text>
<text x="1252" y="532" font-size="25" font-weight="650" fill="#243448">Radio weighting network</text>
<text x="1252" y="564" font-size="21" font-weight="400" fill="#243448">13 comparison inputs → 48 → 2</text>
<text x="1252" y="590" font-size="21" font-weight="400" fill="#243448">Compares radio with visual estimate</text>
<text x="1252" y="616" font-size="21" font-weight="400" fill="#243448">Outputs 2 correction weights</text>
</g>
<path d="M315 630 V680" fill="none" stroke="#596773" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g data-card="visual_features"><rect x="90" y="685" width="450" height="145" rx="10" fill="#f0eafb" stroke="#7862bc" stroke-width="1.6"/>
<text x="112" y="712" font-size="14" font-weight="700" fill="#645196">NEURAL NETWORK</text>
<text x="112" y="742" font-size="25" font-weight="650" fill="#243448">Image feature vector</text>
<text x="112" y="774" font-size="21" font-weight="400" fill="#243448">Spatial summary: 1,728 numbers</text>
<text x="112" y="800" font-size="21" font-weight="400" fill="#243448">Learned projection → 256 numbers</text>
</g>
<path d="M540 755 H660" fill="none" stroke="#596773" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="550" y="739" font-size="18" font-weight="400" fill="#596773">256 features</text>
<path d="M885 630 V680" fill="none" stroke="#596773" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="905" y="663" font-size="18" font-weight="400" fill="#596773">64 features</text>
<g data-card="gru"><rect x="660" y="685" width="450" height="145" rx="10" fill="#f0eafb" stroke="#7862bc" stroke-width="1.6"/>
<text x="682" y="712" font-size="14" font-weight="700" fill="#645196">RECURRENT NEURAL NETWORK</text>
<text x="682" y="742" font-size="25" font-weight="650" fill="#243448">GRU • memory over time</text>
<text x="682" y="774" font-size="21" font-weight="400" fill="#243448">256 + 64 = 320 inputs per step</text>
<text x="682" y="800" font-size="21" font-weight="400" fill="#243448">1 layer • 128 memory values</text>
</g>
<path d="M90 550 H75 V975 H90" fill="none" stroke="#596773" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M885 830 V900" fill="none" stroke="#596773" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="905" y="870" font-size="18" font-weight="400" fill="#596773">128 values</text>
<g data-card="marker"><rect x="90" y="905" width="450" height="145" rx="10" fill="#f0eafb" stroke="#7862bc" stroke-width="1.6"/>
<text x="112" y="932" font-size="14" font-weight="700" fill="#645196">NEURAL NETWORK</text>
<text x="112" y="962" font-size="25" font-weight="650" fill="#243448">Marker location head</text>
<text x="112" y="994" font-size="21" font-weight="400" fill="#243448">Uses CNN image feature maps</text>
<text x="112" y="1020" font-size="21" font-weight="400" fill="#243448">Outputs pixel x, y + visibility</text>
</g>
<g data-card="state_head"><rect x="660" y="905" width="450" height="145" rx="10" fill="#f0eafb" stroke="#7862bc" stroke-width="1.6"/>
<text x="682" y="932" font-size="14" font-weight="700" fill="#645196">NEURAL NETWORK</text>
<text x="682" y="962" font-size="25" font-weight="650" fill="#243448">State prediction heads</text>
<text x="682" y="994" font-size="21" font-weight="400" fill="#243448">Read the 128-value memory</text>
<text x="682" y="1020" font-size="21" font-weight="400" fill="#243448">Produce 15 pad / deck estimates</text>
</g>
<path d="M1110 975 H1170 V550 H1230" fill="none" stroke="#596773" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1170 975 H1230" fill="none" stroke="#596773" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="1170" cy="975" r="4" fill="#596773"/>
<path d="M1470 630 V900" fill="none" stroke="#596773" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1490" y="755" font-size="18" font-weight="400" fill="#596773">2 weights</text>
<g data-card="blend"><rect x="1230" y="905" width="480" height="145" rx="10" fill="#ffffff" stroke="#a6adb7" stroke-width="1.6"/>
<text x="1252" y="932" font-size="14" font-weight="700" fill="#596773">CALCULATION • CONTROLLED BY NETWORK</text>
<text x="1252" y="962" font-size="25" font-weight="650" fill="#243448">Apply optional radio correction</text>
<text x="1252" y="994" font-size="21" font-weight="400" fill="#243448">Adjusts estimated position / velocity</text>
<text x="1252" y="1020" font-size="21" font-weight="400" fill="#243448">Unavailable radio → zero correction</text>
</g>
<path d="M1470 385 H1760 V975 H1710" fill="none" stroke="#596773" stroke-width="2.1" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<circle cx="1470" cy="385" r="4" fill="#596773"/>
<text x="90" y="1160" font-size="17" font-weight="700" fill="#243448">3   NETWORK OUTPUTS</text>
<path d="M315 1050 V1200" fill="none" stroke="#596773" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1470 1050 V1200" fill="none" stroke="#596773" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g data-card="marker_output"><rect x="90" y="1205" width="450" height="175" rx="10" fill="#ffffff" stroke="#a6adb7" stroke-width="1.6"/>
<text x="112" y="1243" font-size="25" font-weight="650" fill="#243448">Marker in the picture</text>
<text x="112" y="1275" font-size="21" font-weight="400" fill="#243448">x pixel coordinate</text>
<text x="112" y="1301" font-size="21" font-weight="400" fill="#243448">y pixel coordinate</text>
<text x="112" y="1327" font-size="21" font-weight="400" fill="#243448">Visibility confidence</text>
<text x="112" y="1353" font-size="21" font-weight="400" fill="#243448">3 numbers</text>
</g>
<g data-card="state_output"><rect x="660" y="1205" width="1050" height="175" rx="10" fill="#ffffff" stroke="#a6adb7" stroke-width="1.6"/>
<text x="682" y="1243" font-size="25" font-weight="650" fill="#243448">15 numbers describing the pad / deck</text>
<text x="682" y="1275" font-size="21" font-weight="400" fill="#243448">Visibility (1) + relative position (3) + relative velocity (3)</text>
<text x="682" y="1301" font-size="21" font-weight="400" fill="#243448">Deck heading (2) + deck normal (3) + image centre (2) + contact confidence (1)</text>
<text x="682" y="1327" font-size="21" font-weight="400" fill="#243448">The marker head can update the image centre and visibility.</text>
</g>
<path d="M540 1290 H660" fill="none" stroke="#596773" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="90" y="1430" font-size="17" font-weight="700" fill="#243448">4   TURN ESTIMATES INTO MOVEMENT</text>
<path d="M315 1380 V1395 H75 V1545 H90" fill="none" stroke="#596773" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1185 1380 V1410 H450 V1450" fill="none" stroke="#596773" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1305 1380 V1450" fill="none" stroke="#596773" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g data-card="geometry"><rect x="90" y="1455" width="720" height="180" rx="10" fill="#ffffff" stroke="#a6adb7" stroke-width="1.6"/>
<text x="112" y="1482" font-size="14" font-weight="700" fill="#596773">WRITTEN GEOMETRY + TRACKING CODE</text>
<text x="112" y="1512" font-size="25" font-weight="650" fill="#243448">Measure + track the landing pad</text>
<text x="112" y="1544" font-size="21" font-weight="400" fill="#243448">Reads original RGB + marker / deck estimates</text>
<text x="112" y="1570" font-size="21" font-weight="400" fill="#243448">Uses camera calibration + own position</text>
<text x="112" y="1596" font-size="21" font-weight="400" fill="#243448">Fits the known marker; tracks relative movement</text>
<text x="112" y="1622" font-size="21" font-weight="400" fill="#243448">Produces a checked position / movement estimate</text>
</g>
<path d="M810 1545 H900" fill="none" stroke="#596773" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g data-card="control"><rect x="900" y="1455" width="810" height="180" rx="10" fill="#ffffff" stroke="#a6adb7" stroke-width="1.6"/>
<text x="922" y="1482" font-size="14" font-weight="700" fill="#596773">WRITTEN CONTROL CODE • 6 OUTPUTS AT 25 Hz</text>
<text x="922" y="1512" font-size="25" font-weight="650" fill="#243448">Choose the drone’s movement</text>
<text x="922" y="1544" font-size="21" font-weight="400" fill="#243448">Approach, slow down, match the boat, descend</text>
<text x="922" y="1570" font-size="21" font-weight="400" fill="#243448">4 flight commands: forward / right / down speed + yaw rate</text>
<text x="922" y="1596" font-size="21" font-weight="400" fill="#243448">2 camera commands: pan rate + tilt rate</text>
</g>
<text x="90" y="1710" font-size="17" font-weight="700" fill="#243448">5   FLIGHT CONTROL + ACTUATORS</text>
<path d="M1305 1635 V1670 H390 V1730" fill="none" stroke="#596773" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1305 1670 H1470 V1730" fill="none" stroke="#596773" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="1305" cy="1670" r="4" fill="#596773"/>
<g data-card="px4"><rect x="90" y="1735" width="600" height="135" rx="10" fill="#ffffff" stroke="#a6adb7" stroke-width="1.6"/>
<text x="112" y="1762" font-size="14" font-weight="700" fill="#596773">AUTOPILOT SOFTWARE</text>
<text x="112" y="1792" font-size="25" font-weight="650" fill="#243448">PX4 flight controller</text>
<text x="112" y="1824" font-size="21" font-weight="400" fill="#243448">Receives the 4 flight commands</text>
<text x="112" y="1850" font-size="21" font-weight="400" fill="#243448">Calculates 4 motor commands</text>
</g>
<path d="M690 1800 H780" fill="none" stroke="#596773" stroke-width="2.1" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g data-card="motors"><rect x="780" y="1735" width="360" height="135" rx="10" fill="#ffffff" stroke="#a6adb7" stroke-width="1.6"/>
<text x="802" y="1762" font-size="14" font-weight="700" fill="#596773">ACTUATORS</text>
<text x="802" y="1792" font-size="25" font-weight="650" fill="#243448">4 motors + rotors</text>
<text x="802" y="1824" font-size="21" font-weight="400" fill="#243448">Produce thrust</text>
<text x="802" y="1850" font-size="21" font-weight="400" fill="#243448">Move the aircraft</text>
</g>
<g data-card="gimbal"><rect x="1230" y="1735" width="480" height="135" rx="10" fill="#ffffff" stroke="#a6adb7" stroke-width="1.6"/>
<text x="1252" y="1762" font-size="14" font-weight="700" fill="#596773">ACTUATORS</text>
<text x="1252" y="1792" font-size="25" font-weight="650" fill="#243448">Camera pan / tilt mechanism</text>
<text x="1252" y="1824" font-size="21" font-weight="400" fill="#243448">Receives the 2 camera commands</text>
<text x="1252" y="1850" font-size="21" font-weight="400" fill="#243448">Changes the camera’s view</text>
</g>
<path d="M960 1870 V1920 H45 V260 H90" fill="none" stroke="#596773" stroke-width="2.1" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="480" y="1905" font-size="21" font-weight="400" fill="#596773">Movement changes the next image and drone measurements. Repeat.</text>
<text x="90" y="1970" font-size="19" font-weight="400" fill="#596773">Own position goes directly to tracking; it is not a position-coordinate input to the 32-value neural vector.</text>
<text x="90" y="2000" font-size="19" font-weight="400" fill="#596773">Scope: current R15 student runtime. The separate teacher, training loop and simulator are outside this diagram.</text>
</svg>
