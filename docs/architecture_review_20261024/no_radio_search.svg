<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1170" viewBox="0 0 1600 1170" role="img" aria-labelledby="title desc">
<title id="title">No radio: search, inspect, verify</title><desc id="desc">The live v60 teacher uses a yaw survey at three camera tilt bands, interrupts for plausible boats, inspects with bounded approach and confirms identity before landing. Intended tree rules and city80 demonstration shortcuts are distinguished.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#61777e"/></marker></defs>
<style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#142e38}.title{font-size:43px;font-weight:700;letter-spacing:-1px}.sub{font-size:21px;fill:#536b73}.heading{font-size:25px;font-weight:650}.body{font-size:21px}.small{font-size:18px;fill:#536b73}.tag{font-size:16px;font-weight:700;letter-spacing:1.4px}</style>
<rect width="1600" height="1170" fill="#f5f4ee"/>
<text x="60" y="70" class="title">No radio: the hard part happens before landing</text>
<text x="60" y="112" class="sub">What the current v60 teacher does • based on code on disk, 24 October 2026</text>
<rect x="60" y="165" width="450" height="165" rx="16" fill="white" stroke="#087f79" stroke-width="1.8"/>
<text x="83" y="203" class="heading">1   Look and remember</text>
<text x="83" y="238" class="body">RGB detects candidate boats</text>
<text x="83" y="265" class="body">Own pose turns pixels into bearings</text>
<text x="83" y="292" class="body">Plane prior gives uncertain range</text>
<text x="83" y="319" class="body">Unseen target has no known location</text>
<path d="M510 247 H570" fill="none" stroke="#61777e" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="575" y="165" width="450" height="165" rx="16" fill="white" stroke="#a96112" stroke-width="1.8"/>
<text x="598" y="203" class="heading">2   Survey when needed</text>
<text x="598" y="238" class="body">Brake motion / hold current height</text>
<text x="598" y="265" class="body">Rotate aircraft: −0.35 rad/s</text>
<text x="598" y="292" class="body">36 heading sectors; about 18 s / turn</text>
<text x="598" y="319" class="body">Camera tilt bands: 18° → 6° → 35°</text>
<path d="M1025 247 H1085" fill="none" stroke="#61777e" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1090" y="165" width="450" height="165" rx="16" fill="white" stroke="#a96112" stroke-width="1.8"/>
<text x="1113" y="203" class="heading">3   Inspect an opportunity</text>
<text x="1113" y="238" class="body">A plausible visible boat can interrupt</text>
<text x="1113" y="265" class="body">Yaw and point the camera toward it</text>
<text x="1113" y="292" class="body">Approach only with a fresh track</text>
<text x="1113" y="319" class="body">Clear corridor + heading error &lt; 20°</text>
<path d="M1315 330 V395" fill="none" stroke="#61777e" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="1090" y="400" width="450" height="195" rx="16" fill="white" stroke="#087f79" stroke-width="1.8"/>
<text x="1113" y="438" class="heading">4   Gather identity evidence</text>
<text x="1113" y="473" class="body">Likely target: ≥ 24 px, peak ≥ 0.85</text>
<text x="1113" y="500" class="body">Confirm: 3 distinct strong captures</text>
<text x="1113" y="527" class="body">Target threshold: ≥ 0.98</text>
<text x="1113" y="554" class="body">Wrong design: repeated ≥ 0.98</text>
<text x="1113" y="581" class="body">Uncertain is not the same as wrong</text>
<path d="M1090 497 H1030" fill="none" stroke="#61777e" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="575" y="400" width="450" height="195" rx="16" fill="white" stroke="#a96112" stroke-width="1.8"/>
<text x="598" y="438" class="heading">5   Keep this physical target</text>
<text x="598" y="473" class="body">Remember identity across track IDs</text>
<text x="598" y="500" class="body">Get fresh metric pad geometry</text>
<text x="598" y="527" class="body">Align above deck; match velocity</text>
<text x="598" y="554" class="body">Only then permit descent</text>
<text x="598" y="581" class="body">Near deck: look down / recover locally</text>
<path d="M575 497 H515" fill="none" stroke="#61777e" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="60" y="400" width="450" height="195" rx="16" fill="white" stroke="#315eaa" stroke-width="1.8"/>
<text x="83" y="438" class="heading">6   Touch down and finish</text>
<text x="83" y="473" class="body">Flight controller follows the deck</text>
<text x="83" y="500" class="body">Touchdown / land detection</text>
<text x="83" y="527" class="body">Disarm is a separate termination step</text>
<text x="83" y="554" class="body">Harness also checks physical outcome</text>
<text x="83" y="581" class="body">Boat landing is scored independently</text>
<path d="M1540 500 H1570 V665 H30 V365 H800 V340" fill="none" stroke="#61777e" stroke-width="2.3" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
<text x="855" y="650" class="small">Wrong / unresolved → remember the view and resume search</text>
<rect x="60" y="725" width="720" height="215" rx="16" fill="#fff5e5" stroke="#a96112" stroke-width="1.8"/>
<text x="83" y="763" class="heading">Tree intent ≠ all implemented behaviour</text>
<text x="83" y="798" class="body">No explicit strict scan_1 / relaxed scan_2 switch is learned.</text>
<text x="83" y="825" class="body">Current code interrupts a scan for an ordinary plausible boat.</text>
<text x="83" y="852" class="body">Post-survey choice uses class then first-seen order.</text>
<text x="83" y="879" class="body">Colour is an identity-association cue, not that picker’s rank.</text>
<text x="83" y="906" class="body">No general far-candidate fly-over-and-verify state exists.</text>
<rect x="820" y="725" width="720" height="215" rx="16" fill="#edf2fb" stroke="#315eaa" stroke-width="1.8"/>
<text x="843" y="763" class="heading">City80 is a different demonstration</text>
<text x="843" y="798" class="body">Two scripted legs; gimbal pans ±30° every 9 seconds.</text>
<text x="843" y="825" class="body">Waypoints are built in a frame anchored on the true pad.</text>
<text x="843" y="852" class="body">Turn-in points at that pad; lock uses visibility raycasts.</text>
<text x="843" y="879" class="body">Six centred sightings within true range ≤ 55 m trigger lock.</text>
<text x="843" y="906" class="body">Then the stock simulator-truth landing expert takes over.</text>
<text x="60" y="1010" class="tag" style="fill:#087f79">WHY THE BOTTLENECK MATTERS</text>
<text x="60" y="1052" class="heading">A sweep reveals directions. It cannot create pixels, resolve a distant hull, or prove which boat is ours.</text>
<text x="60" y="1090" class="body">The actor must detect a weak candidate, safely close for a better view, distinguish decoys, and preserve identity.</text>
<text x="60" y="1130" class="small">If every distant candidate falls below the proposal gate, a stationary 360° scan can finish without a usable target.</text>
</svg>
