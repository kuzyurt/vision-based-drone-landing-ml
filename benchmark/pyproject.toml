[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark"
version = "0.2.0"
description = "Frozen 20-case MuJoCo/PX4 landing-policy benchmark"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mujoco==3.14.0",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "Pillow>=10,<13",
  "pymavlink==2.4.50",
  "opencv-python>=4.10,<5",
  "torch>=2.7,<3",
  "torchvision>=0.22,<1",
  "psutil>=5.9,<8",
]

[project.scripts]
benchmark = "benchmark.harness.run:main"

[tool.setuptools]
packages = ["benchmark", "benchmark.harness"]
