[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aerodock"
version = "0.1.0"
description = "AERODOCK boat simulation, asset pipeline and viewer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mujoco==3.14.0",
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[tool.setuptools]
packages = ["usv"]
