[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "px4-mujoco-drone-simulation"
version = "0.1.0"
description = "FreeCAD-derived MuJoCo quadrotor showcase with PX4 SITL and seeded wind"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mujoco==3.14.0", "numpy>=2,<3", "scipy>=1.14,<2", "Pillow>=10,<13",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pymavlink==2.4.50",
]

[project.optional-dependencies]
build = ["fast-simplification==0.2.0"]
test = ["websockets>=14,<16", "aiohttp>=3.10,<4"]

[tool.setuptools]
packages = ["sim"]
