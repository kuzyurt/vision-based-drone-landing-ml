[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datagen"
version = "0.1.0"
description = "Synthetic search-head and pad-finder data generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mujoco==3.14.0",
  "numpy>=2,<3",
  "Pillow>=10,<13",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["training_data_generation*"]
