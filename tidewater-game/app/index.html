<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>AERODOCK · Flight operations</title>
	<link rel="preload" as="image" href="ui/aerodock-start-1280.jpg" imagesrcset="ui/aerodock-start-1280.jpg 1280w, ui/aerodock-start.jpg 1920w" imagesizes="100vw" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Caveat+Brush&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="/src/ui/ui.css" />
	<style>
		html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
		#app, #app canvas { display: block; }
		#fps { position: fixed; top: 10px; left: 12px; z-index: 50; font: 500 12px/1.2 'JetBrains Mono', ui-monospace, monospace;
			color: #e8f6ff; background: rgba(8, 14, 22, 0.55); padding: 5px 9px; border-radius: 6px; pointer-events: none;
			backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); letter-spacing: 0.02em; }
	</style>
</head>
<body>
	<div id="app"></div>
	<div id="fps">-- fps</div>
	<div id="loader" role="status" aria-live="polite" aria-label="Loading AERODOCK">
		<img class="loader-art" src="ui/aerodock-start-1280.jpg" srcset="ui/aerodock-start-1280.jpg 1280w, ui/aerodock-start.jpg 1920w" sizes="100vw" alt="" decoding="async" fetchpriority="high" onload="this.classList.add('is-in')" />
		<div class="loader-scrim"></div>
		<div class="loader-inner">
			<p class="loader-lead">You’re going to fly a coastal drone and launch-boat simulation: take the drone off the deck, keep the radio link clear, and bring it back.</p>
			<div class="loader-panel">
				<div class="loader-row">
					<span class="loader-status">Starting…</span>
					<span class="loader-pct">0%</span>
				</div>
				<div class="loader-bar"><div class="loader-fill"></div><div class="loader-glint"></div></div>
				<div class="loader-note">The first launch compiles the shaders and can take a minute or two. Later visits load much faster.</div>
			</div>
		</div>
	</div>
	<script type="module" src="/src/main.js"></script>
</body>
</html>
