<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AERODOCK · helm operations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
	:root {
		--mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
		--ink: #e7f0eb;
		--muted: rgba(225, 239, 232, .57);
		--faint: rgba(225, 239, 232, .31);
		--line: rgba(222, 239, 231, .15);
		--line-strong: rgba(232, 245, 238, .5);
		--pad: clamp(30px, 3.1vw, 46px);
		--side-tilt: -3.2deg;
		--stern-tilt: 4.6deg;
	}

	* { box-sizing: border-box; }
	html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #030607; }
	body {
		color: var(--ink);
		font: 400 12px/1.45 var(--mono);
		letter-spacing: .08em;
		text-transform: uppercase;
		-webkit-font-smoothing: antialiased;
		text-shadow: 0 0 14px rgba(0, 0, 0, .5);
	}

	.scene { position: fixed; inset: 0; overflow: hidden; }
	.feed {
		position: absolute;
		inset: -4%;
		background: url("feed.jpg") center 48% / cover no-repeat;
		filter: grayscale(.38) saturate(.42) brightness(.37) contrast(1.06) blur(1.2px);
		transform: scale(1.05);
	}
	.veil {
		position: absolute;
		inset: 0;
		background:
			radial-gradient(ellipse 120% 86% at 50% 44%, rgba(3, 7, 8, .12) 0%, rgba(3, 7, 8, .46) 52%, rgba(2, 4, 5, .94) 100%),
			linear-gradient(180deg, rgba(2, 5, 6, .9) 0%, rgba(2, 5, 6, .24) 28%, rgba(2, 5, 6, .2) 62%, rgba(1, 3, 4, .9) 100%);
	}
	.veil::after {
		content: '';
		position: absolute;
		inset: 0;
		background: radial-gradient(ellipse 90% 70% at 50% 52%, transparent 28%, rgba(1, 3, 4, .5) 100%);
	}
	.grain {
		position: absolute;
		inset: -40px;
		background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='2' stitchTiles='stitch'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
		opacity: .045;
		pointer-events: none;
		animation: grain 1.8s steps(3) infinite;
	}
	@keyframes grain {
		0% { transform: translate(0, 0); }
		33% { transform: translate(-13px, 8px); }
		66% { transform: translate(10px, -15px); }
		100% { transform: translate(0, 0); }
	}

	.hud { position: absolute; inset: 0; z-index: 3; padding: var(--pad); }
	.hud::before {
		content: '';
		position: absolute;
		left: var(--pad);
		right: var(--pad);
		top: 106px;
		height: 1px;
		background: var(--line);
	}

	.top { display: flex; align-items: flex-start; justify-content: space-between; }
	.brand { display: flex; align-items: center; gap: 15px; }
	.mark {
		width: 29px;
		height: 29px;
		display: grid;
		place-items: center;
		border: 1px solid var(--line-strong);
		border-radius: 50% 50% 50% 3px;
		color: var(--ink);
		font-size: 13px;
		transform: rotate(-45deg);
	}
	.mark span { transform: rotate(45deg); }
	.brand-copy b { display: block; font-size: 15px; font-weight: 500; letter-spacing: .28em; }
	.brand-copy small { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; font-weight: 400; letter-spacing: .17em; }

	.telemetry {
		position: absolute;
		left: 50%;
		top: 45px;
		display: flex;
		gap: 44px;
		transform: translateX(-50%);
	}
	.telemetry div { min-width: 76px; }
	.telemetry span { display: block; color: var(--muted); font-size: 10px; letter-spacing: .18em; }
	.telemetry b { display: block; margin-top: 2px; color: var(--ink); font-size: 13px; font-weight: 400; letter-spacing: .04em; }
	.telemetry em { margin-left: 3px; color: var(--muted); font-size: 10px; font-style: normal; }

	.mode { display: flex; align-items: center; gap: 10px; padding-top: 2px; }
	.mode-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 10px rgba(231, 240, 235, .6); }
	.mode b { font-size: 14px; font-weight: 500; letter-spacing: .2em; }
	.mode small { color: var(--muted); font-size: 11px; letter-spacing: .16em; }

	/* Primary speed and course. */
	.left-rail { position: absolute; left: var(--pad); top: 247px; width: 154px; }
	.metric + .metric { margin-top: 52px; }
	.metric span { display: block; color: var(--muted); font-size: 12px; letter-spacing: .19em; }
	.metric b { display: inline-block; margin-top: 7px; font-size: 78px; font-weight: 300; line-height: .86; letter-spacing: -.075em; }
	.metric em { margin-left: 6px; color: var(--muted); font-size: 12px; font-style: normal; letter-spacing: .05em; }
	.metric.course b { font-size: 34px; font-weight: 400; letter-spacing: -.025em; }

	/* Center remains clear. */
	.center-mark {
		position: absolute;
		left: 50%;
		top: 54%;
		width: 1px;
		height: 18px;
		background: linear-gradient(180deg, transparent, var(--line-strong), transparent);
		transform: translate(-50%, -50%);
	}
	.center-mark::before,
	.center-mark::after {
		content: '';
		position: absolute;
		top: 50%;
		width: 36px;
		height: 1px;
		background: var(--line);
	}
	.center-mark::before { right: 9px; }
	.center-mark::after { left: 9px; }

	/* Right attitude stack. */
	.attitude {
		position: absolute;
		right: var(--pad);
		top: 142px;
		width: 420px;
		bottom: 92px;
	}
	.attitude::before {
		content: '';
		position: absolute;
		left: -30px;
		top: 4px;
		bottom: 0;
		width: 1px;
		background: var(--line);
	}
	.sketch { position: relative; min-width: 0; }
	.sketch-head {
		display: flex;
		align-items: baseline;
		justify-content: space-between;
		gap: 18px;
		padding-bottom: 9px;
		border-bottom: 1px solid var(--line);
	}
	.sketch-head > span { color: var(--muted); font-size: 11px; letter-spacing: .21em; }
	.sketch-head > b { color: var(--muted); font-size: 11px; font-weight: 400; letter-spacing: .13em; }
	.sketch-head > b em { margin-left: 8px; color: var(--ink); font-size: 17px; font-style: normal; font-weight: 400; letter-spacing: .01em; }

	.stage { position: relative; display: flex; align-items: center; justify-content: center; }
	.side .stage { height: 200px; margin-top: 10px; }
	.side .craft { width: min(100%, 420px); }
	.lower { display: flex; gap: 22px; margin-top: 26px; }
	.stern { width: 174px; flex: 0 0 174px; }
	.stern .stage { height: 190px; margin-top: 10px; }
	.stern .craft { width: min(100%, 174px); }
	.horizon {
		position: absolute;
		left: 2%;
		right: 2%;
		top: 56%;
		height: 1px;
		background: linear-gradient(90deg, transparent, var(--line-strong) 8%, var(--line-strong) 92%, transparent);
	}
	.horizon::before, .horizon::after {
		content: '';
		position: absolute;
		top: -5px;
		height: 11px;
		border-left: 1px solid var(--line-strong);
	}
	.horizon::before { left: 8%; }
	.horizon::after { right: 8%; }
	.pivot {
		position: absolute;
		left: 50%;
		top: calc(56% - 4px);
		width: 8px;
		height: 8px;
		border: 1px solid var(--line-strong);
		border-radius: 50%;
		background: rgba(3, 7, 8, .8);
		transform: translateX(-50%);
	}
	.craft {
		display: block;
		width: auto;
		max-width: 100%;
		max-height: 100%;
		object-fit: contain;
		filter: drop-shadow(0 0 16px rgba(219, 245, 233, .1));
		transform: rotate(var(--tilt, 0deg));
		transform-origin: 50% 55%;
	}

	/* Propulsion readout, paired with the stern sketch. */
	.power {
		flex: 1 1 auto;
		min-width: 0;
		padding-left: 16px;
		border-left: 1px solid var(--line);
	}
	.power-title {
		display: flex;
		align-items: baseline;
		justify-content: space-between;
		padding-bottom: 10px;
		border-bottom: 1px solid var(--line);
		color: var(--muted);
		font-size: 11px;
		letter-spacing: .2em;
	}
	.motor { margin-top: 18px; }
	.motor-line { display: flex; align-items: baseline; justify-content: space-between; }
	.motor-line span { color: var(--muted); font-size: 10px; letter-spacing: .16em; }
	.motor-line b { color: var(--ink); font-size: 16px; font-weight: 400; letter-spacing: .02em; }
	.motor-line b em { margin-left: 4px; color: var(--muted); font-size: 10px; font-style: normal; }
	.bar {
		height: 3px;
		margin-top: 8px;
		background: var(--line);
	}
	.bar i { display: block; height: 100%; background: var(--line-strong); }
	.motor.port .bar i { width: 64%; }
	.motor.stbd .bar i { width: 59%; }

	/* Relative-motion chart. */
	.map-panel {
		position: absolute;
		left: var(--pad);
		bottom: 42px;
		width: 292px;
	}
	.map-head {
		display: flex;
		align-items: baseline;
		justify-content: space-between;
		padding-bottom: 9px;
		border-bottom: 1px solid var(--line);
		color: var(--muted);
		font-size: 10px;
		letter-spacing: .18em;
	}
	.map-head b { color: var(--ink); font-size: 10px; font-weight: 400; letter-spacing: .08em; }
	.radar { display: block; width: 270px; height: 270px; margin: 12px auto 0; }
	.radar .ring { fill: none; stroke: var(--line); stroke-width: 1; }
	.radar .ring.strong { stroke: var(--line-strong); opacity: .6; }
	.radar .axis { stroke: var(--line); stroke-width: 1; }
	.radar .tick { stroke: var(--line); stroke-width: 1; }
	.radar .tick.major { stroke: var(--line-strong); }
	.radar .north { fill: var(--muted); font: 10px var(--mono); letter-spacing: .16em; }
	.radar .vector { stroke: var(--line-strong); stroke-width: 1; stroke-dasharray: 3 4; opacity: .65; }
	.radar .dock { fill: none; stroke: var(--ink); stroke-width: 1.5; }
	.radar .boat { opacity: .92; }
	.map-foot {
		display: flex;
		justify-content: space-between;
		padding-top: 8px;
		color: var(--muted);
		font-size: 10px;
		letter-spacing: .12em;
	}
	.map-foot b { color: var(--ink); font-weight: 400; }

	/* Bottom command strip, like the drone HUD. */
	.modes {
		position: absolute;
		left: 50%;
		bottom: 38px;
		display: flex;
		gap: 2px;
		border: 1px solid var(--line);
		transform: translateX(-50%);
	}
	.modes span {
		min-width: 84px;
		padding: 8px 14px 7px;
		color: var(--muted);
		font-size: 10px;
		letter-spacing: .18em;
		text-align: center;
	}
	.modes span + span { border-left: 1px solid var(--line); }
	.modes .active { color: var(--ink); background: rgba(225, 239, 232, .045); }

	@media (max-width: 1120px) {
		:root { --pad: 26px; }
		.telemetry { gap: 22px; }
		.attitude { width: 340px; }
		.side .stage { height: 168px; }
		.lower { gap: 14px; }
		.stern { width: 145px; flex-basis: 145px; }
		.stern .stage { height: 162px; }
		.stern .craft { width: 145px; }
		.map-panel { width: 250px; }
		.radar { width: 228px; height: 228px; }
		.modes span { min-width: 70px; padding-inline: 9px; }
	}
</style>
</head>
<body>
<div class="scene">
	<div class="feed"></div>
	<div class="veil"></div>
	<div class="grain"></div>

	<div class="hud">
		<header class="top">
			<div class="brand">
				<div class="mark"><span>◢</span></div>
				<div class="brand-copy">
					<b>AERODOCK</b>
					<small>Tidewater · helm</small>
				</div>
			</div>
			<div class="telemetry">
				<div><span>Battery</span><b>86<em>%</em></b></div>
				<div><span>Depth</span><b>6.4<em>m</em></b></div>
				<div><span>Wind</span><b>11<em>kn</em></b></div>
			</div>
			<div class="mode">
				<i class="mode-dot"></i>
				<b>Auto</b>
				<small>Helm</small>
			</div>
		</header>

		<aside class="left-rail" aria-label="Boat motion">
			<div class="metric">
				<span>Speed</span>
				<b>4.2</b><em>kn</em>
			</div>
			<div class="metric course">
				<span>Course</span>
				<b>247°</b>
			</div>
		</aside>

		<div class="center-mark" aria-hidden="true"></div>

		<section class="attitude" aria-label="AERODOCK attitude">
			<figure class="sketch side">
				<header class="sketch-head">
					<span>Profile</span>
					<b>Pitch <em>+3.2°</em></b>
				</header>
				<div class="stage">
					<div class="horizon"></div>
					<div class="pivot"></div>
					<img class="craft" style="--tilt: var(--side-tilt)" src="aerodock-side.png" alt="Orthographic side profile traced from the AERODOCK 3D model">
				</div>
			</figure>

			<div class="lower">
				<figure class="sketch stern">
					<header class="sketch-head">
						<span>Stern</span>
						<b>Roll <em>−4.6°</em></b>
					</header>
					<div class="stage">
						<div class="horizon"></div>
						<div class="pivot"></div>
						<img class="craft" style="--tilt: var(--stern-tilt)" src="aerodock-stern.png" alt="Orthographic stern view traced from the AERODOCK 3D model">
					</div>
				</figure>

				<section class="power" aria-label="Propulsion">
					<div class="power-title"><span>Propulsion</span><span>kW</span></div>
					<div class="motor port">
						<div class="motor-line"><span>Port</span><b>4.0<em>kW</em></b></div>
						<div class="bar"><i></i></div>
					</div>
					<div class="motor stbd">
						<div class="motor-line"><span>Stbd</span><b>3.8<em>kW</em></b></div>
						<div class="bar"><i></i></div>
					</div>
				</section>
			</div>
		</section>

		<section class="map-panel" aria-label="Relative motion">
			<div class="map-head"><span>Relative motion</span><b>25 m</b></div>
			<svg class="radar" viewBox="0 0 280 280" role="img" aria-label="Boat position relative to dock">
				<circle class="ring" cx="140" cy="140" r="124"/>
				<circle class="ring" cx="140" cy="140" r="93"/>
				<circle class="ring" cx="140" cy="140" r="62"/>
				<circle class="ring strong" cx="140" cy="140" r="31"/>
				<line class="axis" x1="140" y1="8" x2="140" y2="272"/>
				<line class="axis" x1="8" y1="140" x2="272" y2="140"/>
				<g class="tick">
					<line x1="140" y1="15" x2="140" y2="23"/><line x1="140" y1="257" x2="140" y2="265"/>
					<line x1="15" y1="140" x2="23" y2="140"/><line x1="257" y1="140" x2="265" y2="140"/>
					<line x1="76" y1="17" x2="80" y2="24"/><line x1="204" y1="17" x2="200" y2="24"/>
					<line x1="76" y1="263" x2="80" y2="256"/><line x1="204" y1="263" x2="200" y2="256"/>
				</g>
				<text class="north" x="140" y="12" text-anchor="middle">N</text>
				<line class="vector" x1="140" y1="140" x2="61.7" y2="173.2"/>
				<image class="boat" href="aerodock-top.png" x="109" y="125" width="62" height="29" transform="rotate(247 140 140)"/>
				<g class="dock" transform="translate(58 170) rotate(22)">
					<path d="M0 0h22v7H0z M16 0v-13h6v13"/>
				</g>
			</svg>
			<div class="map-foot"><span>Dock <b>18.4 m</b></span><span>Bearing <b>247°</b></span></div>
		</section>

		<nav class="modes" aria-label="Helm modes">
			<span class="active">Dock</span><span>Hold</span><span>Troll</span><span>Manual</span>
		</nav>
	</div>
</div>
</body>
</html>
